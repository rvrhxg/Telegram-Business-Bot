[project]
name = "deskline-business-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["app/intervals.py", "app/observability.py", "app/sqlite_backup.py"]
strict = true
