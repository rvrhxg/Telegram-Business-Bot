name: Deskline acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.lock -r requirements-quality.txt
      - run: python -m ruff check app tests scripts
      - run: python -m mypy
      - run: pytest -q
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock -r requirements-quality.txt
      - run: python -m ruff check app tests scripts
      - run: python -m mypy
      - run: pytest -q
      - run: node --check public/app.js
      - run: docker build -t deskline-test .
      - run: python -m scripts.container_smoke
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deskline-screenshots
          path: screenshots/

      - name: Record reproducible UI demonstration
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m scripts.demo
      - uses: actions/upload-artifact@v4
        with:
          name: deskline-demo-video
          path: recordings/
          retention-days: 14
